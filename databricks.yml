# Databricks Asset Bundle Configuration
bundle:
  name: mouna

workspace:
  host: https://adb-7405606934779715.15.azuredatabricks.net

targets:
  dev:
    mode: development
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  azure_storage_key:
    description: "Azure storage account key for mounastorage2025"
    default: ""

resources:
  jobs:
    mouna_pipeline:
      name: "[${bundle.target}] Mouna - Full Pipeline"

      run_as:
        user_name: admin@vjosep3outlook.onmicrosoft.com

      # ── Classic compute cluster for MediaPipe extraction ──────────────────
      job_clusters:
        - job_cluster_key: extraction_cluster
          new_cluster:
            spark_version: "15.4.x-cpu-ml-scala2.12"
            node_type_id: Standard_D4s_v3
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              AZURE_STORAGE_KEY: "${var.azure_storage_key}"

      # ── Serverless environment for training ───────────────────────────────
      environments:
        - environment_key: train_env
          spec:
            client: "1"
            dependencies:
              - torch
              - mlflow
              - pydantic-settings
              - pyyaml
              - scikit-learn

      tasks:
        # Step 1: Extract keypoints on classic compute (MediaPipe + Spark)
        - task_key: extract_keypoints
          job_cluster_key: extraction_cluster
          libraries:
            - pypi:
                package: "mediapipe>=0.10.0"
            - pypi:
                package: "opencv-python-headless"
            - pypi:
                package: "azure-storage-blob"
            - pypi:
                package: "loguru"
            - pypi:
                package: "pyarrow"
          notebook_task:
            notebook_path: ./notebooks/databricks/02_extract_keypoints_spark.py

        # Step 2: Train BiLSTM on serverless (depends on extraction)
        - task_key: train_model
          depends_on:
            - task_key: extract_keypoints
          environment_key: train_env
          notebook_task:
            notebook_path: ./notebooks/databricks/04_train_baseline.py
